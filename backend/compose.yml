services:
  postgres:
    image: postgres:17-alpine
    container_name: ulkona-postgres
    environment:
      POSTGRES_DB: ulkona
      POSTGRES_USER: ulkona
      POSTGRES_PASSWORD: ulkona
    ports:
      - "5432:5432"
    volumes:
      - ulkona-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulkona -d ulkona"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ulkona-postgres-data: